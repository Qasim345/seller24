<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>فهرست محصولات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h1 class="page-title mb-0">فهرست محصولات</h1>
            <span id="resultSummary" class="text-muted small">در حال بارگذاری...</span>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-md-7">
                <label for="searchInput" class="form-label">جستجو</label>
                <div class="input-group">
                    <span class="input-group-text">⌕</span>
                    <input type="search" id="searchInput" class="form-control" placeholder="نام محصول، کتگوری یا شماره محصول..." autocomplete="off">
                    <button type="button" id="clearSearch" class="btn btn-outline-secondary" hidden>پاک کردن</button>
                </div>
            </div>
            <div class="col-md-5">
                <label for="categoryFilter" class="form-label">فلتر کتگوری</label>
                <select id="categoryFilter" class="form-select">
                    <option value="all">همه کتگوری‌ها</option>
                </select>
            </div>
        </div>

        <div id="loadingState" class="alert alert-light text-center">در حال بارگذاری محصولات...</div>
        <div id="errorState" class="alert alert-danger text-center" hidden>
            بارگذاری فایل products.json انجام نشد. صفحه را از طریق یک سرور محلی اجرا کنید.
            <button type="button" id="retryButton" class="btn btn-sm btn-danger me-2">تلاش دوباره</button>
        </div>
        <div id="emptyState" class="alert alert-warning text-center" hidden>محصولی با این مشخصات پیدا نشد.</div>

        <div class="table-responsive table-container">
            <table id="productsTable" class="table table-bordered table-hover align-middle mb-0" hidden>
                <thead class="table-light">
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">عملیات</th>
                        <th scope="col">نام محصول</th>
                        <th scope="col">کتگوری</th>
                        <th scope="col">تصویر کتگوری</th>
                        <th scope="col">مقدار</th>
                    </tr>
                </thead>
                <tbody id="productsGrid"></tbody>
            </table>
        </div>
    </main>

    <script src="app1.js"></script>
</body>
</html>
